<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀀텀관 지도 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        input[type="date"] { position: relative; }
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent; bottom: 0; color: transparent; cursor: pointer;
            height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
        }
        /* 스크롤바 커스텀 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a1a1a1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- ▼ 설정 영역: 배포된 GAS 웹 앱 URL 입력 ▼ -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzCfzBoSCraE8ctS3PNVNnFgkSpdOEkOBCgW-95b_rjvxWEzuMaZPWpHwHEpxhGzPGI/exec"; 
    </script>
    <!-- ▲ 설정 영역 끝 ▲ -->

    <!-- 상단 헤더 -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i class="fas fa-clipboard-check"></i> 퀀텀관 지도 현황
            </h1>
            <button onclick="fetchData()" class="text-sm bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded transition shadow border border-indigo-500 flex items-center gap-1 group">
                <i class="fas fa-sync-alt group-hover:rotate-180 transition-transform duration-500"></i> <span>새로고침</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-6">

        <!-- 로딩 화면 -->
        <div id="loader" class="hidden text-center py-12">
            <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-500"></i>
            <p class="mt-3 text-gray-500 font-medium animate-pulse">데이터를 불러오고 있습니다...</p>
        </div>

        <!-- 필터 컨트롤 패널 -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-wrap lg:flex-nowrap gap-4 items-end justify-between">

            <!-- 좌측 그룹: 날짜, 반, 검색 -->
            <div class="flex flex-wrap gap-4 items-end w-full lg:w-auto">
                <!-- 기간 선택 -->
                <div class="flex items-center gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">시작일</label>
                        <div class="relative group">
                            <input type="date" id="startDate" class="border border-gray-300 rounded px-3 py-2 text-sm w-36 focus:ring-2 focus:ring-indigo-500 outline-none font-mono group-hover:border-indigo-300 transition" onchange="renderDashboard()">
                            <i class="fas fa-calendar-alt absolute right-3 top-2.5 text-gray-400 pointer-events-none"></i>
                        </div>
                    </div>
                    <span class="text-gray-400 pb-2 font-bold">~</span>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">종료일</label>
                        <div class="relative group">
                            <input type="date" id="endDate" class="border border-gray-300 rounded px-3 py-2 text-sm w-36 focus:ring-2 focus:ring-indigo-500 outline-none font-mono group-hover:border-indigo-300 transition" onchange="renderDashboard()">
                            <i class="fas fa-calendar-alt absolute right-3 top-2.5 text-gray-400 pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <!-- 반 선택 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">반 (Class)</label>
                    <div class="relative">
                        <select id="classFilter" class="appearance-none border border-gray-300 rounded px-3 py-2 text-sm w-24 focus:ring-2 focus:ring-indigo-500 outline-none bg-white pr-8 cursor-pointer hover:border-indigo-300 transition" onchange="renderDashboard()">
                            <option value="All">전체</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-3 top-3 text-gray-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- [신규] 지도유형 선택 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">지도유형</label>
                    <div class="relative">
                        <select id="typeFilter" class="appearance-none border border-gray-300 rounded px-3 py-2 text-sm w-32 focus:ring-2 focus:ring-indigo-500 outline-none bg-white pr-8 cursor-pointer hover:border-indigo-300 transition" onchange="renderDashboard()">
                            <option value="All">전체 유형</option>
                            <!-- JS로 자동 추가됨 -->
                        </select>
                        <i class="fas fa-chevron-down absolute right-3 top-3 text-gray-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- 검색 (크기 제한 적용: max-w-xs) -->
                <div class="flex-grow min-w-[200px] max-w-xs">
                    <label class="block text-xs font-bold text-gray-500 mb-1">통합 검색</label>
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-xs"></i>
                        <input type="text" id="searchInput" placeholder="이름, 학번 검색..." class="pl-9 border border-gray-300 rounded px-3 py-2 text-sm w-full focus:ring-2 focus:ring-indigo-500 outline-none transition hover:border-indigo-300" onkeyup="renderDashboard()">
                    </div>
                </div>
            </div>

            <!-- 우측 그룹: 토글 버튼 2개 (세로 배치 & 원래 크기 복원) -->
            <div class="flex flex-col gap-3 justify-center border-l pl-5 border-gray-200 min-w-[150px] shrink-0 pb-1 h-full mt-2 lg:mt-0">
                <!-- 1. 경고만 보기 -->
                <label class="flex items-center cursor-pointer gap-2.5 select-none text-xs font-bold text-gray-600 hover:text-indigo-600 transition">
                    <div class="relative">
                        <input type="checkbox" id="alertOnlyFilter" class="sr-only peer" onchange="renderDashboard()">
                        <!-- 원래 크기 (w-9 h-5) 복원 -->
                        <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                    </div>
                    <span>경고 누적만 보기</span>
                </label>

                <!-- 2. 야간자습 미확인 -->
                <label class="flex items-center cursor-pointer gap-2.5 select-none text-xs font-bold text-gray-600 hover:text-slate-800 transition">
                    <div class="relative">
                        <input type="checkbox" id="nightFilter" class="sr-only peer" onchange="renderDashboard()">
                        <!-- 원래 크기 (w-9 h-5) 복원 -->
                        <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-slate-700"></div>
                    </div>
                    <span>야간자습 미확인</span>
                </label>
            </div>

        </div>


        <!-- 요약 통계 카드 -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-indigo-500 flex justify-between items-center hover:shadow-md transition">
                <div>
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">총 건수</p>
                    <h3 class="text-2xl font-bold text-indigo-700 mt-1" id="totalCount">-</h3>
                </div>
                <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-500"><i class="fas fa-list-ol"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-amber-500 flex justify-between items-center hover:shadow-md transition">
                <div>
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">수면 주의</p>
                    <h3 class="text-2xl font-bold text-amber-600 mt-1" id="sleepCount">-</h3>
                </div>
                <div class="w-10 h-10 bg-amber-50 rounded-full flex items-center justify-center text-amber-500"><i class="fas fa-bed"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-rose-500 flex justify-between items-center hover:shadow-md transition">
                <div>
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">전자기기</p>
                    <h3 class="text-2xl font-bold text-rose-600 mt-1" id="deviceCount">-</h3>
                </div>
                <div class="w-10 h-10 bg-rose-50 rounded-full flex items-center justify-center text-rose-500"><i class="fas fa-mobile-alt"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-500 flex justify-between items-center hover:shadow-md transition">
                <div>
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">기타 지도</p>
                    <h3 class="text-2xl font-bold text-emerald-600 mt-1" id="etcCount">-</h3>
                </div>
                <div class="w-10 h-10 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-500"><i class="fas fa-check"></i></div>
            </div>
        </div>

        <!-- 데이터 테이블 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h2 class="font-bold text-gray-700 flex items-center gap-2"><i class="fas fa-history text-indigo-500"></i> 상세 기록</h2>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-gray-400 hidden sm:inline"><i class="fas fa-info-circle"></i> 행을 클릭하여 상담 입력</span>
                    <span id="resultCount" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded border border-indigo-100">0건</span>
                </div>
            </div>

            <div class="overflow-x-auto min-h-[300px] custom-scrollbar">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-600 border-b border-gray-200 whitespace-nowrap">
                        <tr>
                            <th class="px-6 py-3 font-semibold w-24">날짜/시간</th>
                            <th class="px-6 py-3 font-semibold w-32">위치/좌석</th>
                            <th class="px-6 py-3 font-semibold w-40">학생 정보</th>
                            <th class="px-6 py-3 font-semibold w-28">지도 유형</th>
                            <!-- 누적 경고 컬럼 너비 확보 -->
                            <th class="px-6 py-3 font-semibold min-w-[200px]">누적 경고</th>
                            <th class="px-6 py-3 font-semibold w-28">상담 여부</th>
                            <th class="px-6 py-3 font-semibold min-w-[150px]">비고</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 bg-white">
                        <!-- 데이터 로딩 영역 -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- 상담 기록 모달 -->
    <div id="consultModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden transform transition-all scale-100">
            <!-- 모달 헤더 -->
            <div class="bg-indigo-600 px-6 py-4 flex justify-between items-center border-b border-indigo-500">
                <h3 class="text-white font-bold text-lg flex items-center gap-2">
                    <i class="fas fa-user-edit"></i> 상담 내역 기록
                </h3>
                <button onclick="closeModal()" class="text-indigo-200 hover:text-white transition rounded-full p-1 hover:bg-indigo-500">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <!-- 모달 본문 -->
            <div class="p-6 space-y-5">
                <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 flex gap-4 items-center">
                    <div class="bg-white p-3 rounded-full shadow-sm text-indigo-600">
                        <i class="fas fa-user text-xl"></i>
                    </div>
                    <div>
                        <div class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <span id="modalName">홍길동</span> 
                            <span id="modalClass" class="text-xs bg-indigo-200 text-indigo-800 px-1.5 py-0.5 rounded">2K</span>
                        </div>
                        <div class="text-sm text-gray-500 mt-0.5">
                            학번: <span id="modalId" class="font-mono">1234</span> | 
                            위반: <span id="modalType" class="font-bold text-rose-500">수면주의</span>
                        </div>
                        <div class="text-xs text-gray-400 mt-1">
                            <i class="far fa-clock"></i> <span id="modalDate">2026-01-22</span> <span id="modalTime">14:00:00</span>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">
                            <i class="far fa-comment-dots text-gray-400 mr-1"></i>상담 내용
                        </label>
                        <textarea id="consultContent" rows="4" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none transition" placeholder="학생과의 상담 내용 및 지도 사항을 상세히 입력하세요."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">
                            <i class="fas fa-chalkboard-teacher text-gray-400 mr-1"></i>생활담임 (지도교사)
                        </label>
                        <input type="text" id="consultTeacher" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="선생님 성함 입력">
                    </div>
                </div>
            </div>

            <!-- 모달 푸터 -->
            <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3 border-t border-gray-100">
                <button onclick="closeModal()" class="px-5 py-2.5 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition shadow-sm">
                    취소
                </button>
                <button onclick="saveConsultation(this)" class="px-5 py-2.5 text-sm font-bold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition shadow-md flex items-center gap-2">
                    <i class="fas fa-save"></i> 저장하기
                </button>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        let currentRecord = null;

        window.addEventListener('DOMContentLoaded', () => {
            // [복구됨] 오늘 날짜 구하기 (YYYY-MM-DD 형식)
            // 한국 시간(KST) 기준 날짜를 정확히 얻기 위해 오프셋 보정
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000; // ms 단위
            const today = new Date(now.getTime() - offset).toISOString().split('T')[0];
            
            // 날짜 필터에 오늘 날짜 세팅
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
            
            // 데이터 불러오기 시작
            fetchData();
        });

        async function fetchData() {
            if (!API_URL.includes("script.google.com")) {
                alert("API_URL을 설정해주세요!");
                return;
            }

            const loader = document.getElementById('loader');
            const tbody = document.getElementById('tableBody');
            
            loader.classList.remove('hidden');
            tbody.innerHTML = '';

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                rawData = data;
                initFilters(data);
                renderDashboard();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-10 text-red-500 font-bold">데이터를 불러오지 못했습니다. URL을 확인해주세요.</td></tr>';
            } finally {
                loader.classList.add('hidden');
            }
        }

        function initFilters(data) {
            const classes = [...new Set(data.map(r => r.classNum).filter(c => c))].sort();
            const select = document.getElementById('classFilter');
            if(select.options.length === 1) { 
                classes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.innerText = c;
                    select.appendChild(opt);
                });
            }
            // 2. [신규] 지도유형 목록 초기화
            // normalizeType 함수를 이용해 '전자기기 위반 (패드)' 같은 것도 '전자기기 위반'으로 통일해서 수집 가능
            // 여기서는 원본 데이터를 그대로 수집하되, 빈 값은 제외
            const types = [...new Set(data.map(r => r.type).filter(t => t && t.trim() !== ''))].sort();
            const typeSelect = document.getElementById('typeFilter');

            if (typeSelect.options.length === 1) {
                types.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.innerText = t;
                    typeSelect.appendChild(opt);
                });
            }
        }

        function renderDashboard() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const classVal = document.getElementById('classFilter').value;
            const typeVal = document.getElementById('typeFilter').value; // ★ 추가됨
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            const alertOnly = document.getElementById('alertOnlyFilter').checked;
            const nightOnly = document.getElementById('nightFilter').checked;

            const filtered = rawData.filter(item => {
                const isDateInRange = item.date >= startDate && item.date <= endDate;
                const isClassMatch = classVal === 'All' || String(item.classNum) === classVal;

                // ★ [신규] 유형 필터 로직
                // '전체 유형'이거나, 데이터의 type이 선택된 값과 정확히 일치(또는 포함)하는지 확인
                const isTypeMatch = typeVal === 'All' || String(item.type) === typeVal;

                const isSearchMatch = !searchVal ||
                    String(item.name).toLowerCase().includes(searchVal) ||
                    String(item.studentId).includes(searchVal);

                const isAlertMatch = alertOnly ? (item.alertText && String(item.alertText).trim() !== '') : true;
                const isNightMatch = nightOnly ? (String(item.type).includes('야간') && (!item.consultation || String(item.consultation).trim() === '')) : true;

                return isDateInRange && isClassMatch && isTypeMatch && isSearchMatch && isAlertMatch && isNightMatch;
            });

            // ... 정렬 및 업데이트 로직 그대로 유지 ...
            filtered.sort((a, b) => {
                const dtA = a.date + a.time;
                const dtB = b.date + b.time;
                return dtA < dtB ? 1 : -1;
            });

            updateStats(filtered);
            updateTable(filtered);
        }



        function updateStats(data) {
            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('sleepCount').innerText = data.filter(i => normalizeType(i.type) === '수면주의').length;
            document.getElementById('deviceCount').innerText = data.filter(i => normalizeType(i.type) === '전자기기 위반').length;
            document.getElementById('etcCount').innerText = data.filter(i => !['수면주의', '전자기기 위반'].includes(normalizeType(i.type))).length;
            document.getElementById('resultCount').innerText = `${data.length}건`;
        }

        function updateTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-gray-400 bg-gray-50 italic">해당 조건의 기록이 없습니다.</td></tr>';
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.onclick = (e) => {
                    if (window.getSelection().toString().length > 0) return;
                    openModal(row);
                };
                
                tr.className = "hover:bg-indigo-50 transition-colors duration-200 cursor-pointer group border-b border-gray-50 last:border-0";
                const typeStyle = getTypeStyle(row.type);
                
                const hasConsult = row.consultation && String(row.consultation).trim() !== '';
                const consultBadge = hasConsult 
                    ? `<span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded text-[11px] font-bold shadow-sm whitespace-nowrap">
                         <i class="fas fa-check"></i> 완료
                       </span>`
                    : `<span class="inline-flex items-center gap-1 bg-slate-100 text-slate-400 border border-slate-200 px-2 py-0.5 rounded text-[11px] font-medium group-hover:bg-white group-hover:text-slate-500 transition whitespace-nowrap">
                         <i class="fas fa-pen"></i> 미입력
                       </span>`;

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="font-bold text-gray-700 text-xs">${row.date}</div>
                        <div class="font-mono text-gray-400 text-[11px] mt-0.5">${row.time.substring(0, 5)}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-800">${row.location}</div>
                        <div class="text-xs text-gray-400 mt-0.5">좌석 <span class="font-mono font-bold text-gray-600">${row.seat}</span></div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-800">${row.name}</span>
                            <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-bold">${row.classNum}</span>
                        </div>
                        <div class="text-xs text-gray-400 mt-0.5 font-mono tracking-tighter">${row.studentId}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="${typeStyle} px-2.5 py-1 rounded-md text-xs font-bold inline-block text-center min-w-[70px] shadow-sm bg-opacity-90">${row.type}</span>
                    </td>
                    <!-- ★ 수정됨: 누적 경고 전체 표시 -->
                    <td class="px-6 py-4">
                        ${row.alertText 
                            ? `<div class="flex items-start text-rose-600 font-bold text-xs bg-rose-50 px-2 py-1.5 rounded border border-rose-100 whitespace-normal break-words leading-snug text-left max-w-[250px]">
                                <i class="fas fa-exclamation-triangle mr-1.5 mt-0.5 flex-shrink-0"></i>
                                <span>${row.alertText}</span>
                               </div>` 
                            : '<span class="text-gray-300 text-xs pl-2">-</span>'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex flex-col items-start gap-1">
                            ${consultBadge}
                            ${hasConsult ? `<span class="text-[10px] text-gray-500 pl-0.5 truncate max-w-[80px]"><i class="fas fa-user-tag text-[9px] mr-1"></i>${row.teacher}</span>` : ''}
                        </div>
                    </td>
                    <td class="px-6 py-4 text-xs text-gray-500 relative">
                        ${row.note 
                            ? `<div class="bg-gray-50 p-2 rounded border border-gray-100 max-w-[180px] break-keep leading-snug whitespace-normal">
                                ${row.note}
                               </div>` 
                            : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal(record) {
            currentRecord = record;
            document.getElementById('modalName').innerText = record.name;
            document.getElementById('modalClass').innerText = record.classNum;
            document.getElementById('modalId').innerText = record.studentId;
            document.getElementById('modalType').innerText = record.type;
            document.getElementById('modalDate').innerText = record.date;
            document.getElementById('modalTime').innerText = record.time;
            document.getElementById('consultContent').value = record.consultation || '';
            document.getElementById('consultTeacher').value = record.teacher || '';
            document.getElementById('consultModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('consultModal').classList.add('hidden');
            currentRecord = null;
        }

        function saveConsultation(btnElement) {
            if (!currentRecord) return;
            const content = document.getElementById('consultContent').value.trim();
            const teacher = document.getElementById('consultTeacher').value.trim();
            if (!content || !teacher) {
                alert("상담 내용과 담당 선생님 성함을 모두 입력해주세요.");
                return;
            }
            const payload = {
                action: 'update',
                date: currentRecord.date,
                time: currentRecord.time,
                studentId: currentRecord.studentId,
                consultation: content,
                teacher: teacher
            };
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 저장 중...';
            btnElement.disabled = true;

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    currentRecord.consultation = content;
                    currentRecord.teacher = teacher;
                    renderDashboard(); 
                    closeModal();
                    alert("✅ 상담 내역이 저장되었습니다.");
                } else {
                    alert("❌ 저장 실패: " + result.message);
                }
            })
            .catch(error => {
                console.error(error);
                alert("⚠️ 저장 중 오류가 발생했습니다.");
            })
            .finally(() => {
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            });
        }

        function getTypeStyle(type) {
            const t = normalizeType(type);
            if (t === '수면주의') return 'bg-amber-100 text-amber-700 ring-1 ring-amber-200';
            if (t === '전자기기 위반') return 'bg-rose-100 text-rose-700 ring-1 ring-rose-200';
            if (t === '정숙주의') return 'bg-emerald-100 text-emerald-700 ring-1 ring-emerald-200';
            if (t === '수업참여') return 'bg-blue-100 text-blue-700 ring-1 ring-blue-200';
            return 'bg-gray-100 text-gray-600 ring-1 ring-gray-200';
        }

        function normalizeType(t) {
            t = String(t || '').trim();
            if (t.includes('전자기기')) return '전자기기 위반';
            if (t.includes('수업참여')) return '수업참여';
            if (t === '정숙주의') return '정숙주의';
            if (t === '수면주의') return '수면주의';
            return t;
        }
    </script>
</body>
</html>
