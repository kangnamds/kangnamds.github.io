<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강남대성 생활 관리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. [공통] 변수 및 기본 설정 (강남대성 민트 테마)
           ========================================================================== */
        :root {
            /* [컬러 팔레트] */
            --primary-mint: #5DC6C2;
            /* 메인 민트 */
            --primary-hover: #4BB3AF;
            /* 호버 시 진한 민트 */
            --text-dark: #1a2b4b;
            /* 텍스트 네이비 */
            --bg-color: #F4F9F9;
            /* 배경 연한 민트 그레이 */
            --card-shadow: 0 10px 20px rgba(93, 198, 194, 0.15);
            /* 민트 그림자 */
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-sizing: border-box;
        }

        /* 타이틀 스타일 */
        h1.title {
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 50px;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* 민트색 밑줄 포인트 */
        h1.title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: var(--primary-mint);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        /* 2열 그리드 메뉴 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* 메뉴 버튼 스타일 */
        .menu-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            /* 기본 상태: 흰색 배경 */
            background-color: white;
            color: var(--text-dark);
            text-decoration: none;

            /* 모양 및 그림자 */
            border-radius: 20px;
            border: 2px solid transparent;
            box-shadow: var(--card-shadow);

            aspect-ratio: 1 / 1;
            /* 정사각형 비율 유지 */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

            font-weight: 700;
            font-size: 1.5rem;
            text-align: center;
            word-break: keep-all;
        }

        /* 호버 효과: 민트색 반전 + 그림자 확대 */
        .menu-btn:hover {
            transform: translateY(-5px);
            background-color: var(--primary-mint);
            color: white;
            box-shadow: 0 15px 30px rgba(93, 198, 194, 0.4);
            border-color: var(--primary-mint);
        }

        /* 클릭 효과 */
        .menu-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(93, 198, 194, 0.3);
        }

        /* 모바일 반응형 */
        @media (max-width: 480px) {
            h1.title {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }

            .grid-menu {
                gap: 15px;
            }

            .menu-btn {
                font-size: 1.3rem;
                border-radius: 16px;
            }
        }
    </style>

</head>

<body>

    <div class="container">
        <!-- 상단 제목 -->
        <h1 class="title">강남대성 생활 관리</h1>

        <!-- 2x2 격자 메뉴 영역 -->
        <div class="grid-menu">
            <!-- 지도교사 버튼 -->
            <a href="teacher_c.html" class="menu-btn">
                지도교사
            </a>

            <!-- CM 버튼 -->
            <a href="CMmenu.html" class="menu-btn">
                CM
            </a>
        </div>
    </div>

</body>

</html>
