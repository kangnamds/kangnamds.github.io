<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강남대성 생활 관리</title>
    <!-- 구글 폰트 (Noto Sans KR) 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. 기본 초기화 및 스타일 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa; /* 눈이 편안한 밝은 회색 배경 */
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 2. 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 600px; /* PC에서는 너무 퍼지지 않게 제한 */
            padding: 2rem;
            text-align: center;
        }

        /* 3. 상단 제목 스타일 */
        h1.title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a2b4b; /* 강남대성 느낌의 짙은 네이비 */
            margin-bottom: 3rem;
            letter-spacing: -1px;
        }

        /* 4. 버튼 그룹 레이아웃 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* 버튼 사이 간격 */
        }

        /* 5. 공통 버튼 스타일 */
        .main-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 80px; /* 커다란 버튼 높이 */
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* 버튼 호버 효과 (마우스 올렸을 때) */
        .main-btn:hover {
            transform: translateY(-2px); /* 살짝 떠오르는 느낌 */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .main-btn:active {
            transform: translateY(0);
        }

        /* 6. 개별 버튼 색상 */
        /* 지도교사 버튼: 메인 강조색 (네이비) */
        .btn-teacher {
            background-color: #1a2b4b;
            color: #ffffff;
            border: 1px solid #1a2b4b;
        }

        /* CM 버튼: 보조색 (흰색 바탕에 테두리) - 깔끔한 대조 */
        .btn-cm {
            background-color: #ffffff;
            color: #1a2b4b;
            border: 2px solid #1a2b4b;
        }

        /* 7. 모바일 반응형 처리 */
        @media (max-width: 480px) {
            h1.title {
                font-size: 2rem;
                margin-bottom: 2.5rem;
            }
            .main-btn {
                height: 70px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 제목 -->
        <h1 class="title">강남대성 생활 관리</h1>

        <!-- 버튼 영역 -->
        <div class="button-group">
            <!-- 지도교사 버튼: teacher.html 연결 -->
            <a href="teacher.html" class="main-btn btn-teacher">
                지도교사
            </a>

            <!-- CM 버튼: 현재는 링크 없음 (#) -->
            <a href="CM_Qtrecord/index.html" class="main-btn btn-cm")>
                CM
            </a>
        </div>
    </div>

</body>
</html>
