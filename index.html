<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈페이지 메인</title>
    <style>
        /* [스타일 설정 구역] 화면의 디자인을 담당합니다 */
        body {
            /* 전체 화면 설정 */
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; /* 글씨체 */
            display: flex;
            flex-direction: column; /* 위에서 아래로 정렬 */
            align-items: center;    /* 가로 가운데 정렬 */
            justify-content: center;/* 세로 가운데 정렬 */
            height: 100vh;          /* 화면 전체 높이 사용 */
            margin: 0;
            background-color: #f0f2f5; /* 아주 연한 회색 배경 */
        }

        h1 {
            /* '환영합니다!!' 제목 디자인 */
            margin-bottom: 40px; /* 버튼들과의 간격 */
            color: #333;         /* 글자색 (진한 회색) */
            font-size: 32px;     /* 글자 크기 */
        }

        .button-container {
            /* 버튼들을 감싸는 상자 */
            display: flex;
            flex-direction: column; /* 버튼을 위아래로 배치 (가로는 row) */
            gap: 15px;              /* 버튼 사이 간격 */
            width: 80%;             /* 너비는 화면의 80% */
            max-width: 300px;       /* 너무 커지지 않게 최대 300px로 제한 */
        }

        .menu-btn {
            /* 버튼 모양 디자인 */
            display: block;
            padding: 15px 0;        /* 위아래 여백 */
            text-align: center;     /* 글자 가운데 정렬 */
            background-color: #4a90e2; /* 버튼 배경색 (파란색 계열) */
            color: white;           /* 글자색 (흰색) */
            text-decoration: none;  /* 밑줄 없애기 */
            border-radius: 10px;    /* 모서리 둥글게 */
            font-size: 18px;        /* 글자 크기 */
            font-weight: bold;      /* 글자 굵게 */
            transition: 0.3s;       /* 마우스 올렸을 때 부드럽게 변함 */
        }

        .menu-btn:hover {
            /* 마우스를 올렸을 때 색상 변화 */
            background-color: #357abd; /* 조금 더 진한 파란색 */
        }
    </style>
</head>
<body>

    <!-- ▼▼▼ 화면에 보이는 내용 시작 ▼▼▼ -->

    <!-- 1. 제목 영역 -->
    <h1>환영합니다!!</h1>

    <!-- 2. 버튼 영역 (4개) -->
    <div class="button-container">
        <!-- 버튼 1 -->
        <a href="page1.html" class="menu-btn">메뉴 1번으로 이동</a>
        
        <!-- 버튼 2 -->
        <a href="seat_map.html" class="menu-btn">좌석 배치도 보기</a>
        
        <!-- 버튼 3 -->
        <a href="notice.html" class="menu-btn">공지사항 확인</a>
        
        <!-- 버튼 4 -->
        <a href="contact.html" class="menu-btn">관리자에게 문의</a>
    </div>

</body>
</html>
