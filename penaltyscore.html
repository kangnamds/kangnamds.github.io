<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>벌점 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4c51bf 0%, #6b46c1 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* 화면 전체 사용 */
        .container-fluid {
            max-width: 100%;
            padding: 0 20px;
        }

        /* 메인 컨테이너 */
        .content-container {
            display: flex;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            min-height: 85vh;
            width: 100%;
        }

        .header-title {
            color: white;
            padding: 10px 10px 20px 10px;
            margin-bottom: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .status-badge {
            font-size: 0.9em;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            font-weight: bold;
        }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafb 100%);
            border-right: 1px solid #eee;
            padding: 30px 0;
            flex-shrink: 0;
        }

        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .sidebar-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 18px 30px;
            border: none;
            background: transparent;
            color: #495057;
            font-weight: 600;
            font-size: 1.15em;
            cursor: pointer;
            border-left: 5px solid transparent;
            margin: 5px 0;
            transition: all 0.2s;
        }

            .sidebar-btn:hover {
                background-color: #f0f5ff;
                color: #4c51bf;
                padding-left: 35px;
            }

            .sidebar-btn.active {
                background: linear-gradient(90deg, #4c51bf15 0%, transparent 100%);
                color: #4c51bf;
                border-left-color: #4c51bf;
                font-weight: 700;
                padding-left: 30px;
            }

        .form-control, .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 1rem;
        }

            .form-control:focus, .form-select:focus {
                border-color: #4c51bf;
                box-shadow: 0 0 0 3px rgba(76, 81, 191, 0.1);
            }

        .form-label {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
            font-size: 0.95em;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4c51bf 0%, #6b46c1 100%);
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 1.05em;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(76, 81, 191, 0.3);
        }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 15px rgba(76, 81, 191, 0.4);
            }

        .btn-success {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 1.05em;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
        }

        /* 버튼 스타일 수정 */
        .btn-refresh {
            background: white;
            border: 1px solid #e2e8f0;
            color: #4a5568;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

            .btn-refresh:hover {
                background: #f7fafc;
                border-color: #cbd5e0;
                transform: rotate(180deg);
            }

        .quick-btn {
            margin: 4px;
            border: 2px solid #4c51bf;
            color: #4c51bf;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 6px;
            background: white;
            font-size: 0.9em;
        }

            .quick-btn:hover {
                background: #4c51bf;
                color: white;
                transform: translateY(-2px);
            }

        .student-tag {
            background: #4c51bf;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95em;
            margin: 4px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .delete-tag {
            margin-left: 10px;
            cursor: pointer;
            color: #fed7d7;
            font-weight: bold;
        }

        .table-custom {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

            .table-custom th {
                background-color: #f7fafc;
                font-weight: 800;
                color: #2d3748;
                border-bottom: 2px solid #4c51bf;
                padding: 15px;
                font-size: 1em;
            }

            .table-custom td {
                vertical-align: middle;
                font-size: 1em;
                padding: 15px;
                border-bottom: 1px solid #e2e8f0;
            }

        .info-banner {
            background: #ebf8ff;
            border-left: 5px solid #4c51bf;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .info-label {
            font-size: 0.9em;
            color: #718096;
            margin-right: 10px;
            font-weight: 600;
        }

        .info-value {
            font-weight: 800;
            color: #2d3748;
            margin-right: 25px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-3 pt-2">
            <h2 class="header-title fw-bold m-0 ps-2">📝 벌점 관리 시스템</h2>
            <span id="statusBadge" class="status-badge me-3">연결 중...</span>
        </div>

        <div class="content-container">
            <div class="sidebar">
                <button class="sidebar-btn active" onclick="switchTab('single', this)">개별 입력</button>
                <button class="sidebar-btn" onclick="switchTab('multi', this)">다중 입력</button>
                <button class="sidebar-btn" onclick="switchTab('search', this)">조회</button>
            </div>

            <div class="content-area">

                <!-- 1. 개별 입력 -->
                <div id="single" class="tab-section">
                    <div class="row justify-content-center">
                        <div class="col-xl-6 col-lg-8">
                            <form id="singleForm">
                                <div class="row g-3 mb-3">
                                    <div class="col-md-4">
                                        <label class="form-label">학번</label>
                                        <input type="text" class="form-control" id="s_id" placeholder="입력" oninput="findStudent(this.value, 's_')" style="font-weight: bold;">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">반</label>
                                        <input type="text" class="form-control bg-light" id="s_class" readonly tabindex="-1">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">이름</label>
                                        <input type="text" class="form-control bg-light" id="s_name" readonly tabindex="-1">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">구분</label>
                                    <select class="form-select" id="s_type" onchange="toggleScoreInput('s_')">
                                        <option value="벌점">벌점</option>
                                        <option value="경고">경고</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">벌점 항목 (자동완성)</label>
                                    <input class="form-control" list="ruleOptions" id="s_item" placeholder="항목 검색..." onchange="matchScore(this.value, 's_')">
                                    <datalist id="ruleOptions"></datalist>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">점수</label>
                                        <input type="number" class="form-control" id="s_score" style="font-weight: bold; color: #e53e3e;">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">작성자 <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="s_writer" placeholder="선생님 성함">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">비고</label>
                                    <input type="text" class="form-control" id="s_note">
                                </div>

                                <button type="button" class="btn btn-primary w-100" onclick="submitSingle()">입력 완료</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- 2. 다중 입력 -->
                <div id="multi" class="tab-section" style="display:none;">
                    <div class="row justify-content-center">
                        <div class="col-xl-7 col-lg-9">
                            <div class="mb-3">
                                <label class="form-label">학번 입력</label>
                                <input type="text" class="form-control" id="multi_input" placeholder="학번 입력 후 Enter" onkeyup="handleEnter(event)" style="font-size: 1.2rem; font-weight: bold;">
                            </div>

                            <div id="studentQueue" class="mb-4 p-3 bg-light border rounded-3 shadow-sm" style="min-height: 100px;">
                                <div class="text-muted small">대기 목록이 여기에 표시됩니다.</div>
                            </div>

                            <hr class="my-4 opacity-25">

                            <div id="quickButtonsArea" class="mb-4 text-center"></div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-9">
                                    <input class="form-control" list="ruleOptions" id="m_item" placeholder="항목 선택 (또는 직접 입력)" onchange="matchScore(this.value, 'm_')">
                                </div>
                                <div class="col-md-3">
                                    <input type="number" class="form-control" id="m_score" placeholder="점수" style="font-weight: bold; color: #e53e3e;">
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <input type="text" class="form-control" id="m_writer" placeholder="작성자 (필수)">
                                </div>
                                <div class="col-md-6">
                                    <input type="text" class="form-control" id="m_note" placeholder="비고">
                                </div>
                            </div>

                            <button type="button" class="btn btn-success w-100" onclick="submitMulti()">일괄 적용</button>
                        </div>
                    </div>
                </div>

                <!-- 3. 조회 (디자인 개선됨) -->
                <div id="search" class="tab-section" style="display:none;">
                    <div class="row justify-content-center">
                        <div class="col-xl-11">

                            <!-- 예쁜 검색창 디자인 -->
                            <div class="d-flex gap-3 mb-4 align-items-center">
                                <div class="position-relative flex-grow-1">
                                    <span class="position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">🔍</span>
                                    <input type="text" class="form-control form-control-lg border-0 shadow-sm ps-5 pe-5"
                                           id="searchKeyword"
                                           placeholder="이름 또는 학번 검색 (실시간)"
                                           oninput="doSearchLocal()"
                                           style="background-color: #f8f9fa; height: 50px;">
                                    <button class="btn position-absolute top-50 end-0 translate-middle-y me-2 text-muted border-0 bg-transparent"
                                            type="button" onclick="clearSearch()" style="font-size: 1.5rem; line-height: 1;">
                                        &times;
                                    </button>
                                </div>
                                <button class="btn btn-refresh shadow-sm" onclick="reloadHistory()" title="새로고침">
                                    ↻
                                </button>
                            </div>

                            <div id="searchStudentInfo"></div>

                            <div class="d-flex justify-content-end mb-2">
                                <span id="searchStatus" class="fw-bold text-muted fs-6"></span>
                            </div>

                            <div class="table-responsive rounded-3 shadow-sm border">
                                <table class="table table-hover table-custom mb-0" id="resultTable">
                                    <thead>
                                        <tr>
                                            <th style="width:15%">날짜</th>
                                            <th style="width:30%">사유</th>
                                            <th style="width:10%">점수</th>
                                            <th style="width:10%">누적</th>
                                            <th style="width:10%">작성자</th>
                                            <th style="width:25%">비고</th>
                                        </tr>
                                    </thead>
                                    <tbody id="searchResultBody">
                                        <tr><td colspan="6" class="text-center py-5 text-muted">검색어를 입력하세요.</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================
        // [설정] 배포된 웹 앱 URL을 여기에 넣으세요
        const GAS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzFjCVgOOCvqTWS5P45kMuf3y_ivhN3x7pInFdFIlLtiT7UQbsomTWlQkQaK3t6Ff2l/exec';
        // ============================================

        const QUICK_BUTTONS = [
            { label: '지각(1점)', item: '지각', score: 1 },
            { label: '소란(2점)', item: '면학분위기 저해', score: 2 },
            { label: '취식(1점)', item: '음식물 섭취', score: 1 },
            { label: '미입실(2점)', item: '무단 미입실', score: 2 },
            { label: '태블릿(3점)', item: '전자기기 오용', score: 3 }
        ];

        let STUDENT_DB = {};
        let RULE_DB = [];
        let MULTI_QUEUE = [];
        let HISTORY_DB = []; // 전체 기록 저장소
        let isDataReady = false;

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-section').forEach(el => el.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        window.onload = function () {
            renderQuickButtons();
            const savedWriter = localStorage.getItem('penalty_writer');
            if (savedWriter) {
                document.getElementById('s_writer').value = savedWriter;
                document.getElementById('m_writer').value = savedWriter;
            }

            fetch(`${GAS_SCRIPT_URL}?action=getRules`).then(res => res.json()).then(data => { RULE_DB = data; initDatalist(); });

            fetch(`${GAS_SCRIPT_URL}?action=getStudents`).then(res => res.json()).then(data => {
                STUDENT_DB = data;
                isDataReady = true;
                checkAllDataLoaded();
            });

            reloadHistory();
        };

        function checkAllDataLoaded() {
            if (isDataReady && HISTORY_DB.length > 0) {
                const badge = document.getElementById('statusBadge');
                badge.innerText = "준비 완료";
                badge.style.background = "rgba(255,255,255,0.9)";
                badge.style.color = "#667eea";
                badge.style.fontWeight = "bold";
            }
        }

        function reloadHistory() {
            const status = document.getElementById('searchStatus');
            status.innerText = "동기화 중...";

            fetch(`${GAS_SCRIPT_URL}?action=getAllHistory`)
                .then(res => res.json())
                .then(data => {
                    HISTORY_DB = data;
                    status.innerText = `기록 ${data.length}건`;
                    checkAllDataLoaded();

                    const keyword = document.getElementById('searchKeyword').value.trim();
                    if (keyword) doSearchLocal();
                })
                .catch(err => status.innerText = "동기화 실패");
        }

        function renderQuickButtons() {
            const area = document.getElementById('quickButtonsArea');
            if (!area) return;
            QUICK_BUTTONS.forEach(btn => {
                const b = document.createElement('button');
                b.className = 'quick-btn';
                b.innerText = btn.label;
                b.onclick = () => {
                    document.getElementById('m_item').value = btn.item;
                    document.getElementById('m_score').value = btn.score;
                };
                area.appendChild(b);
            });
        }

        function initDatalist() {
            const list = document.getElementById('ruleOptions');
            let html = '';
            RULE_DB.forEach(r => html += `<option value="${r.item}">`);
            list.innerHTML = html;
        }

        function findStudent(id, prefix) {
            id = id.trim();
            if (!id || !isDataReady) return;
            const s = STUDENT_DB[id];
            if (s) {
                document.getElementById(prefix + 'name').value = s.name;
                document.getElementById(prefix + 'class').value = s.class;
            } else {
                document.getElementById(prefix + 'name').value = '';
                document.getElementById(prefix + 'class').value = '';
            }
        }

        function toggleScoreInput(prefix) {
            const type = document.getElementById(prefix + 'type').value;
            const scoreInput = document.getElementById(prefix + 'score');

            if (type === '경고') {
                scoreInput.value = '';
                scoreInput.disabled = true;
                scoreInput.placeholder = "점수 없음";
                scoreInput.style.backgroundColor = "#e9ecef";
            } else {
                scoreInput.disabled = false;
                scoreInput.placeholder = "";
                scoreInput.style.backgroundColor = "white";
            }
        }

        function matchScore(val, prefix) {
            if (prefix === 's_') {
                const type = document.getElementById('s_type').value;
                if (type === '경고') return;
            }
            const r = RULE_DB.find(x => x.item === val);
            if (r) document.getElementById(prefix + 'score').value = r.score;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                const id = e.target.value.trim();
                if (!STUDENT_DB[id]) { alert("올바른 학번이 아닙니다."); return; }
                if (!MULTI_QUEUE.find(q => q.id === id)) {
                    MULTI_QUEUE.push({ id, ...STUDENT_DB[id] });
                    renderQueue();
                }
                e.target.value = '';
            }
        }

        function renderQueue() {
            const area = document.getElementById('studentQueue');
            if (MULTI_QUEUE.length === 0) { area.innerHTML = '<div class="text-muted small">대기 목록이 여기에 표시됩니다.</div>'; return; }
            let html = '';
            MULTI_QUEUE.forEach((s, i) => {
                html += `<span class="student-tag">${s.class} ${s.name} <span class="delete-tag" onclick="removeQueue(${i})">&times;</span></span>`;
            });
            area.innerHTML = html;
        }
        function removeQueue(i) { MULTI_QUEUE.splice(i, 1); renderQueue(); }

        function processSubmit(data, btn) {
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "저장 중...";
            return fetch(GAS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') { alert(res.message); return true; }
                    else { alert("오류: " + res.message); return false; }
                })
                .finally(() => { btn.disabled = false; btn.innerText = originalText; });
        }

        function submitSingle() {
            const id = document.getElementById('s_id').value.trim();
            const writer = document.getElementById('s_writer').value.trim();
            const type = document.getElementById('s_type').value;
            let score = document.getElementById('s_score').value;

            if (!STUDENT_DB[id]) { alert("학번을 확인하세요."); return; }
            if (!writer) { alert("작성자를 입력하세요."); return; }

            if (type === '경고') score = 0;
            else if (!score) { alert("점수를 입력하세요."); return; }

            localStorage.setItem('penalty_writer', writer);

            const data = [{
                id: id, class: STUDENT_DB[id].class, name: STUDENT_DB[id].name,
                type: type,
                item: document.getElementById('s_item').value,
                score: score,
                writer: writer,
                note: document.getElementById('s_note').value
            }];

            const btn = document.querySelector('#single button.btn-primary');
            processSubmit(data, btn).then(success => {
                if (success) {
                    document.getElementById('singleForm').reset();
                    toggleScoreInput('s_');
                    document.getElementById('s_writer').value = writer;
                }
            });
        }

        function submitMulti() {
            if (MULTI_QUEUE.length === 0) { alert("학생을 추가하세요."); return; }
            const writer = document.getElementById('m_writer').value.trim();
            if (!writer) { alert("작성자를 입력하세요."); return; }

            let score = document.getElementById('m_score').value;
            if (!score) { alert("점수를 입력하세요."); return; }

            localStorage.setItem('penalty_writer', writer);

            const commonData = {
                item: document.getElementById('m_item').value,
                score: score,
                writer: writer,
                note: document.getElementById('m_note').value
            };
            const data = MULTI_QUEUE.map(s => ({ id: s.id, class: s.class, name: s.name, type: '벌점', ...commonData }));

            const btn = document.querySelector('#multi button.btn-success');
            processSubmit(data, btn).then(success => {
                if (success) {
                    MULTI_QUEUE = []; renderQueue();
                    document.getElementById('m_item').value = '';
                    document.getElementById('m_score').value = '';
                    document.getElementById('m_note').value = '';
                }
            });
        }

        function clearSearch() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('searchStudentInfo').innerHTML = '';
            document.getElementById('searchResultBody').innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">검색어를 입력하세요.</td></tr>';
            document.getElementById('searchStatus').innerText = '';
            document.getElementById('searchKeyword').focus();
        }

        function doSearchLocal() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            const tbody = document.getElementById('searchResultBody');
            const infoBanner = document.getElementById('searchStudentInfo');

            if (!keyword) {
                clearSearch();
                return;
            }

            if (isDataReady) {
                let matched = [];
                if (STUDENT_DB[keyword]) matched.push({ id: keyword, ...STUDENT_DB[keyword] });
                else { for (let k in STUDENT_DB) if (STUDENT_DB[k].name.includes(keyword)) matched.push({ id: k, ...STUDENT_DB[k] }); }

                if (matched.length > 0) {
                    let html = '';
                    matched.forEach(s => {
                        html += `<div class="info-banner"><span class="info-label">반</span><span class="info-value">${s.class}</span><span class="info-label">이름</span><span class="info-value">${s.name}</span><span class="info-label">학번</span><span class="info-value">${s.id}</span><span class="info-label">위치</span><span class="info-value">${s.quantum || '-'} / ${s.seat || '-'}</span></div>`;
                    });
                    infoBanner.innerHTML = html;
                } else {
                    infoBanner.innerHTML = '';
                }
            }

            const results = HISTORY_DB.filter(r => r.id.includes(keyword) || r.name.includes(keyword));

            if (results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">검색 결과가 없습니다.</td></tr>';
                document.getElementById('searchStatus').innerText = "결과 0건";
            } else {
                let html = '';
                results.forEach(r => {
                    let dateStr = '-';
                    if (r.date) {
                        const d = new Date(r.date);
                        if (!isNaN(d)) {
                            const month = d.getMonth() + 1;
                            const day = d.getDate();
                            const week = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
                            dateStr = `${month}/${day}(${week})`;
                        } else {
                            dateStr = r.date.substring(5, 10);
                        }
                    }

                    let scoreDisplay = '';
                    const scoreNum = Number(r.score);
                    if (r.score == 0 || r.score === '0') {
                        scoreDisplay = '<span class="badge bg-warning text-dark">경고</span>';
                    } else if (scoreNum >= 10) {
                        scoreDisplay = `<span class="text-danger fw-black" style="font-weight:900; text-decoration:underline;">${r.score}점</span>`;
                    } else {
                        scoreDisplay = `<span class="text-danger fw-bold">${r.score}점</span>`;
                    }

                    let totalDisplay = '-';
                    const totalNum = Number(r.total);
                    if (r.total && !isNaN(totalNum)) {
                        if (totalNum >= 50) totalDisplay = `<span class="badge rounded-pill" style="background-color: #8B0000; color: white;">${r.total}</span>`;
                        else if (totalNum >= 40) totalDisplay = `<span class="badge rounded-pill" style="background-color: #FF9999; color: #5a0000;">${r.total}</span>`;
                        else if (totalNum >= 30) totalDisplay = `<span class="badge rounded-pill bg-primary">${r.total}</span>`;
                        else if (totalNum >= 20) totalDisplay = `<span class="badge rounded-pill bg-warning text-dark">${r.total}</span>`;
                        else totalDisplay = `<span class="text-muted fw-bold">${r.total}</span>`;
                    }

                    let rowClass = "";
                    if (r.item && (r.item.includes("퇴소") || r.item.includes("제적") || r.item.includes("강제"))) {
                        rowClass = "table-danger";
                    }

                    html += `
                            <tr class="${rowClass}">
                                <td>${dateStr}</td>
                                <td class="fw-bold text-wrap text-break">${r.item}</td>
                                <td>${scoreDisplay}</td>
                                <td>${totalDisplay}</td>
                                <td>${r.writer || '-'}</td>
                                <td class="text-muted small text-wrap text-break">${r.note || '-'}</td>
                            </tr>`;
                });
                tbody.innerHTML = html;
                document.getElementById('searchStatus').innerText = `총 ${results.length}건`;
            }
        }
    </script>
</body>
</html>
