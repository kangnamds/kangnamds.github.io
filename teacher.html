<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생활담임 관리 메뉴</title>
    <!-- 구글 폰트 (Noto Sans KR) 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* [강남대성 디자인 시스템] */
            --primary-mint: #5DC6C2;
            --primary-hover: #4BB3AF;

            --text-dark: #1a2b4b;
            --bg-color: #F4F9F9;

            --disabled-bg: #e0e0e0;
            --disabled-text: #95a5a6;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-sizing: border-box;
        }

        /* 제목 스타일 (민트 포인트) */
        h1.title {
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 40px;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h1.title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: var(--primary-mint);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        /* 2x2 격자 레이아웃 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* 버튼 기본 스타일 */
        .menu-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background-color: white;
            color: var(--text-dark);
            text-decoration: none;

            border-radius: 20px;
            border: 2px solid transparent;
            box-shadow: 0 10px 20px rgba(93, 198, 194, 0.15);
            /* 민트빛 그림자 */

            aspect-ratio: 1 / 1;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

            font-weight: 700;
            font-size: 1.15rem;
            text-align: center;
            padding: 10px;
            word-break: keep-all;
        }

        /* 아이콘 스타일 */
        .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
        }

        /* 호버 효과 (민트 반전) */
        .menu-btn:hover:not(.disabled) {
            transform: translateY(-5px);
            background-color: var(--primary-mint);
            color: white;
            box-shadow: 0 15px 30px rgba(93, 198, 194, 0.4);
            border-color: var(--primary-mint);
        }

        /* 준비중 버튼 스타일 (비활성) */
        .menu-btn.disabled {
            background-color: var(--disabled-bg);
            color: var(--disabled-text);
            cursor: not-allowed;
            box-shadow: none;
        }

        .menu-btn.disabled:hover {
            transform: none;
            background-color: var(--disabled-bg);
            color: var(--disabled-text);
        }

        /* 모바일 반응형 */
        @media (max-width: 480px) {
            h1.title {
                font-size: 1.8rem;
            }

            .grid-menu {
                gap: 15px;
            }

            .menu-btn {
                font-size: 1.1rem;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <!-- 제목 클래스 추가 -->
        <h1 class="title">관리 메뉴</h1>

        <div class="grid-menu">
            <!-- 1. 퀀텀 지도 현황 -->
            <a href="Dashboard.html" class="menu-btn">
                <span class="icon">📝</span>
                <span>퀀텀 지도 현황</span>
            </a>

            <!-- 2. 출결 보고 -->
            <a href="attendance.html" class="menu-btn">
                <span class="icon">🏫</span>
                <span>출결 보고</span>
            </a>

            <!-- 3. 벌점 관리 -->
            <a href="penaltyscore.html" class="menu-btn">
                <span class="icon">🚫</span>
                <span>벌점 관리</span>
            </a>

            <!-- 4. 컨텐츠 배부 명단 -->
            <a href="content_list.html" class="menu-btn">
                <span class="icon">📚</span>
                <span>컨텐츠 배부 명단</span>
            </a>

            <!-- 5. 학생 검색 -->
            <a href="search_tc.html" class="menu-btn">
                <span class="icon">🔍</span>
                <span>학생 검색</span>
            </a>

            <!-- 6. 준비중 -->
            <a href="#" class="menu-btn disabled" onclick="alert('준비 중인 기능입니다.'); return false;">
                <span class="icon">🚧</span><span>준비중</span>
            </a>
        </div>
    </div>

</body>

</html>
